<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sign in to your VEYRA administrator account."
    >

    <title>VEYRA — Admin Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <!-- BRAND -->

            <a
                href="index.html"
                class="logo login-logo"
            >
<img src="Unknown.jpeg" alt="VEYRA logo" class="logo-image">
<span class="logo-name">VEYRA</span>

            </a>


            <!-- INTRO -->

            <div class="login-heading">

                <span class="eyebrow">
                    ADMIN ACCESS
                </span>

                <h1>
                    Welcome back
                </h1>

                <p>
                    Sign in to manage staff attendance,
                    records, and reports.
                </p>

            </div>


            <!-- ADMIN LOGIN FORM -->

            <form
                id="adminLoginForm"
                class="login-form"
            >

                <!-- ADMIN ID -->

                <div class="form-group">

                    <label for="adminId">
                        Admin ID
                    </label>

                    <input
                        type="text"
                        id="adminId"
                        name="adminId"
                        placeholder="Enter your admin ID"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- REMEMBER ME -->

                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="adminRememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <!-- SIGN IN -->

                <button
                    type="submit"
                    class="login-submit"
                >
                    Sign In
                </button>


                <!-- LOGIN MESSAGE -->

                <p
                    id="adminLoginMessage"
                    class="login-message"
                    role="alert"
                ></p>

            </form>


            <!-- STAFF SWITCH -->

            <div class="switch-login">

                <span>
                    Need staff access?
                </span>

                <a href="staff-login.html">
                    Staff Login
                </a>

            </div>


            <!-- BACK TO ROLE SELECTION -->

            <a
                href="login.html"
                class="back-link"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>

                <span>
                    Choose another account
                </span>

            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
