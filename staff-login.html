<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VEYRA staff login."
    >

    <title>VEYRA — Staff Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <!-- BRAND -->

            <a href="index.html" class="logo login-logo">

                <span class="logo-icon">
                    V
                </span>

                <span class="logo-name">
                    VEYRA
                </span>

            </a>


           

            <div class="login-heading">

                <span class="eyebrow">
                    STAFF ACCESS
                </span>

                <h1>
                    Welcome back
                </h1>

                <p>
                    Sign in to access your attendance
                    dashboard and working hours.
                </p>

            </div>


            
            <form id="staffLoginForm" class="login-form">

                <div class="form-group">

                    <label for="staffId">
                        Staff ID
                    </label>

                    <input
                        type="text"
                        id="staffId"
                        name="staffId"
                        placeholder="e.g. ST-001"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="staffPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="staffPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#" class="forgot-link">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    Sign In
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            

            <div class="switch-login">

                <span>
                    Trying to access the system as an admin?
                </span>

                <a href="admin-login.html">
                    Admin Login
                </a>

            </div>


            <!-- BACK -->

            <a href="login.html" class="back-link">
                ← Choose another login
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
