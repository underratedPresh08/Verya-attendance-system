<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sign in to your VEYRA attendance account."
    >

    <title>VEYRA — Sign In</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>


    <main class="login-page">

        <div class="login-container">

            <!-- BRAND -->

            <a href="index.html" class="logo login-logo">

                <span class="logo-icon">
                    V
                </span>

                <span class="logo-name">
                    VEYRA
                </span>

            </a>


            <!-- INTRO -->

            <div class="login-heading">

                <span class="eyebrow">
                    WELCOME BACK
                </span>

                <h1>
                    Sign in to VEYRA
                </h1>

                <p>
                    Choose how you'd like to access the
                    attendance system.
                </p>

            </div>


            <!-- LOGIN OPTIONS -->

            <div class="login-options">


                <!-- STAFF -->

                <a href="staff-login.html" class="login-option">

                    <div class="option-icon">
                        👤
                    </div>

                    <div class="option-content">

                        <h2>
                            Staff Login
                        </h2>

                        <p>
                            Clock in, view your attendance,
                            and track your working hours.
                        </p>

                    </div>

                    <span class="option-arrow">
                        →
                    </span>

                </a>


                <!-- ADMIN -->

                <a href="admin-login.html" class="login-option">

                    <div class="option-icon">
                        🛡️
                    </div>

                    <div class="option-content">

                        <h2>
                            Admin Login
                        </h2>

                        <p>
                            Manage staff, monitor attendance,
                            and view attendance reports.
                        </p>

                    </div>

                    <span class="option-arrow">
                        →
                    </span>

                </a>


            </div>


            <!-- BACK -->

            <a href="index.html" class="back-link">
                ← Back to homepage
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
