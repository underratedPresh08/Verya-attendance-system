
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Choose your VEYRA account type to continue.">

    <title>VEYRA — Choose Account</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <!-- BRAND -->

            <a href="index.html" class="logo login-logo">

                <img src="Unknown.jpeg" alt="VEYRA logo" class="logo-image">

                <span class="logo-name">
                    VEYRA
                </span>

            </a>


            <!-- INTRO -->

            <div class="login-heading">

                <span class="eyebrow">
                    ACCOUNT ACCESS
                </span>

                <h1>
                    Continue to VEYRA
                </h1>

                <p>
                    Select your account type to continue
                    to the attendance system.
                </p>

            </div>


            <!-- ACCOUNT OPTIONS -->

            <div class="login-options">


                <!-- STAFF -->

                <a href="staff-login.html" class="login-option">

                    <div class="option-icon" aria-hidden="true">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">

                            <path d="M20 21a8 8 0 0 0-16 0"></path>

                            <circle cx="12" cy="7" r="4"></circle>

                        </svg>

                    </div>


                    <div class="option-content">

                        <h2>
                            Staff
                        </h2>

                        <p>
                            Clock in, view attendance,
                            and track working hours.
                        </p>

                    </div>


                    <span class="option-arrow" aria-hidden="true">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">

                            <path d="M5 12h14"></path>

                            <path d="M13 6l6 6-6 6"></path>

                        </svg>

                    </span>

                </a>


                <!-- ADMIN -->

                <a href="admin-login.html" class="login-option">

                    <div class="option-icon" aria-hidden="true">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">

                            <path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"></path>

                            <path d="M9 12l2 2 4-4"></path>

                        </svg>

                    </div>


                    <div class="option-content">

                        <h2>
                            Administrator
                        </h2>

                        <p>
                            Manage staff, monitor attendance,
                            and view reports.
                        </p>

                    </div>


                    <span class="option-arrow" aria-hidden="true">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">

                            <path d="M5 12h14"></path>

                            <path d="M13 6l6 6-6 6"></path>

                        </svg>

                    </span>

                </a>


            </div>


            <!-- BACK TO HOMEPAGE -->

            <a href="index.html" class="back-link">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">

                    <path d="M19 12H5"></path>

                    <path d="M12 19l-7-7 7-7"></path>

                </svg>

                <span>
                    Back to homepage
                </span>

            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
