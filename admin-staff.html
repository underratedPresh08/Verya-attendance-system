<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEYRA — Staff Management</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <aside class="admin-sidebar">

            <a href="index.html" class="admin-logo">

               <img src="Unknown.jpeg" alt="VEYRA logo" class="logo-image">
<span class="logo-name">VEYRA</span>

            </a>


            <nav class="admin-nav">

                <!-- Dashboard -->
                <a
                    href="admin-dashboard.html"
                    class="admin-nav-item"
                >

                    <span class="nav-icon" aria-hidden="true">
                        <svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                        </svg>
                    </span>

                    Dashboard

                </a>


                <!-- Attendance -->
                <a
                    href="admin-attendance.html"
                    class="admin-nav-item"
                >

                    <span class="nav-icon" aria-hidden="true">
                        <svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="12" r="8.5"></circle>
                            <path d="M12 7v5l3 2"></path>
                        </svg>
                    </span>

                    Attendance

                </a>


                <!-- Staff -->
                <a
                    href="admin-staff.html"
                    class="admin-nav-item active"
                >

                    <span class="nav-icon" aria-hidden="true">
                        <svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="8" r="3.5"></circle>
                            <path d="M5 20c.8-3.4 3.2-5 7-5s6.2 1.6 7 5"></path>
                        </svg>
                    </span>

                    Staff

                </a>


                <!-- Reports -->
                <a
                    href="admin-reports.html"
                    class="admin-nav-item"
                >

                    <span class="nav-icon" aria-hidden="true">
                        <svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M4 19V5"></path>
                            <path d="M4 19h16"></path>
                            <path d="M7 16v-4"></path>
                            <path d="M11 16V8"></path>
                            <path d="M15 16v-6"></path>
                            <path d="M19 16V7"></path>
                        </svg>
                    </span>

                    Reports

                </a>


                <!-- Settings -->
                <a
                    href="admin-settings.html"
                    class="admin-nav-item"
                >

                    <span class="nav-icon" aria-hidden="true">
                        <svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L7 17l.1-.1A1.7 1.7 0 0 0 7.4 15a1.7 1.7 0 0 0-1.5-1H5.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L7 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V5.6h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1L19 8.6l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V13h-.2a1.7 1.7 0 0 0-1.5 1Z"></path>
                        </svg>
                    </span>

                    Settings

                </a>

            </nav>


            <div class="admin-sidebar-bottom">

                <a
                    href="login.html"
                    class="admin-logout"
                >

                    <span class="nav-icon" aria-hidden="true">
                        <svg
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M10 17l5-5-5-5"></path>
                            <path d="M15 12H3"></path>
                            <path d="M20 4v16"></path>
                        </svg>
                    </span>

                    Log Out

                </a>

            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="admin-main">

            <!-- PAGE HEADER -->
            <header class="admin-header">

                <div>

                    <p class="admin-eyebrow">
                        STAFF MANAGEMENT
                    </p>

                    <h1>
                        Manage Staff
                    </h1>

                    <p class="admin-header-description">
                        Register and manage staff members in your organization.
                    </p>

                </div>

            </header>


            <!-- REGISTER STAFF -->
            <section class="admin-section">

                <div class="admin-section-heading">

                    <div>

                        <p class="admin-section-label">
                            NEW STAFF MEMBER
                        </p>

                        <h2>
                            Register Staff
                        </h2>

                    </div>

                </div>


                <div class="staff-form-card">

                    <form id="staffRegistrationForm">

                        <div class="staff-form-grid">

                            <!-- FULL NAME -->
                            <div class="admin-form-group">

                                <label for="staffFullName">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="staffFullName"
                                    placeholder="e.g. John Doe"
                                    required
                                >

                            </div>


                            <!-- STAFF ID -->
                            <div class="admin-form-group">

                                <label for="newStaffId">
                                    Staff ID
                                </label>

                                <input
                                    type="text"
                                    id="newStaffId"
                                    placeholder="e.g. ST-002"
                                    required
                                >

                            </div>


                            <!-- DEPARTMENT -->
                            <div class="admin-form-group">

                                <label for="staffDepartment">
                                    Department
                                </label>

                                <select
                                    id="staffDepartment"
                                    required
                                >

                                    <option value="">
                                        Select department
                                    </option>

                                    <option value="IT">
                                        IT
                                    </option>

                                    <option value="Human Resources">
                                        Human Resources
                                    </option>

                                    <option value="Finance">
                                        Finance
                                    </option>

                                    <option value="Marketing">
                                        Marketing
                                    </option>

                                    <option value="Operations">
                                        Operations
                                    </option>

                                </select>

                            </div>


                            <!-- ROLE -->
                            <div class="admin-form-group">

                                <label for="staffRole">
                                    Role
                                </label>

                                <input
                                    type="text"
                                    id="staffRole"
                                    placeholder="e.g. Frontend Developer"
                                    required
                                >

                            </div>


                            <!-- PASSWORD -->
                            <div class="admin-form-group">

                                <label for="newStaffPassword">
                                    Temporary Password
                                </label>

                                <input
                                    type="password"
                                    id="newStaffPassword"
                                    placeholder="Create a password"
                                    required
                                >

                            </div>

                        </div>


                        <div class="staff-form-footer">

                            <p id="staffRegistrationMessage">
                            </p>

                            <button
                                type="submit"
                                class="admin-primary-button"
                            >

                                <svg
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.9"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <path d="M12 5v14"></path>
                                    <path d="M5 12h14"></path>
                                </svg>

                                Register Staff

                            </button>

                        </div>

                    </form>

                </div>

            </section>


            <!-- STAFF LIST -->
            <section class="admin-section">

                <div class="admin-section-heading">

                    <div>

                        <p class="admin-section-label">
                            REGISTERED STAFF
                        </p>

                        <h2>
                            Staff Directory
                        </h2>

                    </div>

                    <span
                        class="staff-count"
                        id="staffCount"
                    >
                        0 staff
                    </span>

                </div>


                <div class="admin-table-container">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>
                                    Staff
                                </th>

                                <th>
                                    Staff ID
                                </th>

                                <th>
                                    Department
                                </th>

                                <th>
                                    Role
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="staffTableBody">

                            <tr>

                                <td
                                    colspan="5"
                                    class="empty-table"
                                >
                                    No staff members registered yet.
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
